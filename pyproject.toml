[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perceptron-lab"
version = "0.1.0"
description = "учебный перцептрон для бинарной классификации"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["perceptron_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["perceptron.py", "perceptron_lab", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true